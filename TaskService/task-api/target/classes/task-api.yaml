openapi: 3.0.4
info:
  title: Task API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        checkedAt:
          type: string
          format: date-time
      required: [status, version, checkedAt]