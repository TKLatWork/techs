schema: spec-driven

context: |
  Project docs live under doc/: management rules in doc/rules/Doc-manage.md, templates in doc/template/, index in doc/AGENTS.md.
  Every doc requires a version a.b.c header and a changelog table; keep wording lean, use lists/tables.
  Representation standards (Mermaid diagrams, Markdown tables, text/diagram diff forms) live in doc/rules/Doc-represent.md - global rule: apply them in all docs, change artifacts, any Markdown file at any path, and chat responses.

rules:
  proposal:
    - "Use standard tables (e.g. Item/Status/Notes) when tracking or comparing items, per doc/rules/Doc-represent.md"
    - "Present changes with the standard diff forms: fenced diff blocks for text/code, Mermaid diagram diffs for diagrams"
  specs:
    - "Keep requirements and scenarios text-first; use Mermaid only when structure/flow/state is clearer than prose"
    - "Present behavior changes with the standard diff forms (text diff or diagram diff), per doc/rules/Doc-represent.md"
  tasks:
    - "Track task progress with checkboxes; use standard tables for any item/status tracking beyond checkboxes"

operations:
  apply:
    guidance:
      - Before starting implementation, run git status; if the working tree has uncommitted changes, pause and ask the user to commit (or approve a baseline commit) first.
      - After all tasks are complete and verified, propose a commit of the implementation with a message summarizing the change; do not leave the tree dirty when handing back.
  archive:
    guidance:
      - Before archiving, confirm the implementation is committed; the archive move should be committed as its own follow-up commit.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
